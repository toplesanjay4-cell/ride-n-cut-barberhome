name: Ride N Cut CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Dependency audit details
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); console.log(JSON.stringify(a.vulnerabilities || {}, null, 2))"
      - name: Block high-severity vulnerabilities
        run: npm audit --audit-level=high
      - name: Type-check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
