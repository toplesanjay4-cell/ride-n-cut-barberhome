name: Build check

on:
  pull_request:
    branches: [main]
  push:
    branches: [redesign/ride-n-cut-overhaul]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Next.js
        run: npm run build
