name: Build check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [redesign/ride-n-cut-overhaul]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check migration integrity
        run: npm run check:migrations
      - name: Run unit tests in UTC and a non-Jakarta browser timezone
        run: |
          npm run test:unit
          TZ=Pacific/Honolulu npm run test:unit
      - name: Report dependency advisories
        run: |
          npm audit --json > npm-audit-report.json || true
          node -e 'const r=require("./npm-audit-report.json"); const items=Object.entries(r.vulnerabilities||{}); if(!items.length){console.log("No dependency advisories found."); process.exit(0)} for(const [name,v] of items){console.log(`${name}: ${v.severity}; range=${v.range}; direct=${v.isDirect}; fix=${JSON.stringify(v.fixAvailable)}`); for(const a of (v.via||[])){if(typeof a!=="string") console.log(`  - ${a.title||a.name}: ${a.url||""}`)}}'
      - name: Block moderate and high dependency vulnerabilities
        run: npm audit --audit-level=moderate
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build Next.js
        run: npm run build
